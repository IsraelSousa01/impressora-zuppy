name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  windows:
    # O app só roda no Windows: o `wmic` sumindo do Windows 11 só apareceria aqui.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test
      - run: npx electron-vite build
